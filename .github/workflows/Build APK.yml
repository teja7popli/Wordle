name: Build ColorWordle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify uploaded source files
        shell: bash
        run: |
          set -euo pipefail
          test -f "Colour Wordle 2.html" || { echo 'Missing file: Colour Wordle 2.html'; exit 1; }
          test -f "1792679266543~2.jpg" || { echo 'Missing file: 1792679266543~2.jpg'; exit 1; }

      - name: Generate Android project and apply agreed WebView/layout fixes
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/colourwordle/app

          cp "Colour Wordle 2.html" app/src/main/assets/index.html
          cp "1792679266543~2.jpg" app/src/main/res/drawable/game_icon.jpg

          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('width:min(calc(100vw - 46px),470px);max-width:calc(100vw - 46px);grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,auto);gap:8px;margin:0 auto 4px',
               'width:min(calc(100vw - 23px),470px);max-width:calc(100vw - 23px);grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(6,auto);gap:8px;margin:0 auto 12px'),
              ('width:min(calc(100vw - 46px),470px);max-width:calc(100vw - 46px);display:flex;flex-direction:column;gap:7px;margin:4px auto 0',
               'width:min(calc(100vw - 23px),470px);max-width:calc(100vw - 23px);display:flex;flex-direction:column;gap:7px;margin:0 auto 0'),
              ('.spacer-bottom{height:23px;min-height:23px;width:100%;flex:none}',
               '.spacer-bottom{height:12px;min-height:12px;width:100%;flex:none}'),
              ('#grid{gap:4px;margin-bottom:3px}.tile{font-size:22px}#keyboard{gap:5px;margin-top:3px}.key{height:clamp(34px,6.5vh,43px)}.spacer-bottom{height:23px;min-height:23px}',
               '#grid{gap:4px;margin-bottom:12px}.tile{font-size:22px}#keyboard{gap:5px;margin-top:0}.key{height:clamp(34px,6.5vh,43px)}.spacer-bottom{height:12px;min-height:12px}')
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(
                      'Expected CSS fragment was not found; refusing to silently skip '
                      'a layout change: ' + old[:100]
                  )
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ColorWordle2'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.colourwordle.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.colourwordle.app'
                  minSdk 23
                  targetSdk 32
                  versionCode 2
                  versionName '2.0'
              }
          }
          GRADLE

          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources>
              <string name="app_name">Color Wordle 2</string>
          </resources>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#22D3EE</item>
                  <item name="android:windowBackground">#030615</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#030615</item>
                  <item name="android:navigationBarColor">#030615</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:icon="@drawable/game_icon"
                  android:roundIcon="@drawable/game_icon"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/colourwordle/app/MainActivity.java <<'JAVA'
          package com.colourwordle.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(3, 6, 21));
                  window.setNavigationBarColor(Color.rgb(3, 6, 21));
                  window.getDecorView().setSystemUiVisibility(0);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(3, 6, 21));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadsImagesAutomatically(true);

                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);

                  if (savedInstanceState == null) {
                      web.loadUrl("file:///android_asset/index.html");
                  } else {
                      web.restoreState(savedInstanceState);
                      if (web.getUrl() == null) {
                          web.loadUrl("file:///android_asset/index.html");
                      }
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (web != null) {
                      web.saveState(outState);
                  }
                  super.onSaveInstanceState(outState);
              }

              @Override
              protected void onPause() {
                  if (web != null) {
                      web.onPause();
                  }
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) {
                      web.onResume();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null) {
                      web.evaluateJavascript(
                          "(function(){var m=document.querySelector('.overlay.show');" +
                          "if(m){m.classList.remove('show');return 'modal';}" +
                          "return 'none';})()",
                          value -> {
                              if ("\"none\"".equals(value)) {
                                  finish();
                              }
                          }
                      );
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.stopLoading();
                      web.setWebChromeClient(null);
                      web.setWebViewClient(null);
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          JAVA

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK to requested filename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk 'release/ColorWordle 1.apk'
          test -s 'release/ColorWordle 1.apk'
          file 'release/ColorWordle 1.apk'

      - name: Upload ColorWordle 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorWordle-1-APK
          path: 'release/ColorWordle 1.apk'
          if-no-files-found: error
          retention-days: 14
          
