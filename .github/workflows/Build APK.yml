name: Build Colour Wordle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -f "Colour Wordle 2.html"
          test -f "1792679266543~2.jpg"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-v31
          mkdir -p app/src/main/java/com/colourwordle/app

          cp "Colour Wordle 2.html" app/src/main/assets/index.html
          cp "1792679266543~2.jpg" app/src/main/res/drawable/game_icon.jpg

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ColourWordle'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.colourwordle.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.colourwordle.app'
                  minSdk 23
                  targetSdk 32
                  versionCode 4
                  versionName '4.0'
              }
          }
          GRADLE

          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources>
              <string name="app_name">Colour Wordle</string>
          </resources>
          XML

          cat > app/src/main/res/drawable/splash_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#030615"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowBackground">#030615</item>
                  <item name="android:colorAccent">#22D3EE</item>
                  <item name="android:statusBarColor">#030615</item>
                  <item name="android:navigationBarColor">#030615</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          XML

          cat > app/src/main/res/values-v31/styles.xml <<'XML'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowBackground">#030615</item>
                  <item name="android:colorAccent">#22D3EE</item>
                  <item name="android:statusBarColor">#030615</item>
                  <item name="android:navigationBarColor">#030615</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowSplashScreenBackground">#030615</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
                  <item name="android:windowSplashScreenAnimationDuration">0</item>
              </style>
          </resources>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:icon="@drawable/game_icon"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|smallestScreenSize|uiMode">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/colourwordle/app/MainActivity.java <<'JAVA'
          package com.colourwordle.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();
                  window.setStatusBarColor(Color.rgb(3, 6, 21));
                  window.setNavigationBarColor(Color.rgb(3, 6, 21));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(3, 6, 21));
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setVerticalScrollBarEnabled(false);
                  web.setHorizontalScrollBarEnabled(false);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(false);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);

                  if (savedInstanceState == null) {
                      web.loadUrl("file:///android_asset/index.html");
                  } else {
                      web.restoreState(savedInstanceState);
                      if (web.getUrl() == null) {
                          web.loadUrl("file:///android_asset/index.html");
                      }
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (web != null) {
                      web.saveState(outState);
                  }
                  super.onSaveInstanceState(outState);
              }

              @Override
              protected void onPause() {
                  if (web != null) {
                      web.onPause();
                  }
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) {
                      web.onResume();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.stopLoading();
                      web.setWebChromeClient(null);
                      web.setWebViewClient(null);
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          JAVA

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release/Wordle 3.apk"
          test -s "release/Wordle 3.apk"

      - name: Upload Wordle 3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Wordle-3
          path: release/Wordle 3.apk
          if-no-files-found: error
          retention-days: 14
          
